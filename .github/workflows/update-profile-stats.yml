name: Update profile statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/generate-profile-stats.mjs"
      - ".github/workflows/update-profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: update-profile-statistics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate profile statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: EslamElshikh-dev
        run: node scripts/generate-profile-stats.mjs

      - name: Commit updated statistics
        run: |
          if git diff --quiet -- assets/github-stats-light.svg assets/github-stats-dark.svg; then
            echo "Profile statistics are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats-light.svg assets/github-stats-dark.svg
          git commit -m "chore: refresh profile statistics"
          git push
